# Example workflow for using the Squidler GitHub Action
#
# This workflow demonstrates how to integrate Squidler quality checks
# into your CI/CD pipeline. Copy this file to your repository's
# .github/workflows/ directory and customize as needed.

name: Squidler Quality Checks

on:
  # Run on pushes to main and develop branches
  push:
    branches:
      - main
      - develop

  # Run on pull requests targeting main
  pull_request:
    branches:
      - main

  # Allow manual triggers
  workflow_dispatch:

jobs:
  squidler-checks:
    name: Run Squidler Quality Checks
    runs-on: ubuntu-latest

    steps:
      # Trigger Squidler quality checks
      - name: Run Squidler Quality Checks
        uses: squidlerio/actions@v1
        with:
          api-key: ${{ secrets.SQUIDLER_API_KEY }}
          repository-id: ${{ github.repository_id }}
          sha: ${{ github.sha }}
          ref: ${{ github.ref }}

      # Optional: Add a comment to the PR with the results
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Squidler quality checks have been triggered! Check the "Checks" tab above for results.'
            })
