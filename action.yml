name: 'Squidler'
description: 'A collection of actions for running Squidler website quality and accessibility checks.'

# This repository hosts several actions, each in its own subdirectory. The bare
# repository path is not itself a usable action — referencing it fails fast with
# a pointer to the real sub-actions. (Up to and including v3 the quality-checks
# action lived at this root; it now lives at `run-remote`.)
runs:
  using: 'composite'
  steps:
    - run: |
        echo "::error::The path 'squidlerio/actions' is not a valid action. Please use 'squidlerio/actions/run-remote' (the quality-checks action formerly published as 'squidlerio/actions@v3') or 'squidlerio/actions/run-local'."
        exit 1
      shell: bash

branding:
  icon: 'check-circle'
  color: 'blue'
