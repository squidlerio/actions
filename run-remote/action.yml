name: 'Squidler Quality Checks'
description: 'Triggers Squidler quality checks for your site and reports results as GitHub check runs'
author: 'Squidler'

# Define Inputs for the Action
inputs:
  api-key:
    description: 'Your Squidler Site API Key (should be stored as a GitHub secret)'
    required: true
  api-url:
    description: 'Squidler API URL'
    required: false
    default: 'https://api.squidler.io'
  repository-id:
    description: 'GitHub repository ID'
    required: true
  sha:
    description: 'Commit SHA'
    required: true
  ref:
    description: 'Branch reference'
    required: true

# Define Outputs for the Action
outputs:
  status:
    description: "Status of the test trigger (success/failure)"
    value: ${{ steps.trigger.outputs.status }}
  message:
    description: "Response message from Squidler API"
    value: ${{ steps.trigger.outputs.message }}

runs:
  using: "composite"
  steps:
    - name: Trigger Squidler Quality Checks
      id: trigger
      shell: bash
      # Inputs are bound to environment variables rather than interpolated
      # directly into the script, so a value containing shell metacharacters
      # cannot execute on the runner.
      env:
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_REPOSITORY_ID: ${{ inputs.repository-id }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REF: ${{ inputs.ref }}
      run: |
        set -e

        echo "::group::Squidler Quality Checks"
        echo "Repository ID: $INPUT_REPOSITORY_ID"
        echo "Commit SHA: $INPUT_SHA"
        echo "Branch: $INPUT_REF"
        echo "API URL: $INPUT_API_URL"
        echo "::endgroup::"

        # Build the JSON body from the environment. git refnames, SHAs and
        # numeric repository ids cannot contain JSON metacharacters, so
        # printf %s yields a well-formed body without a shell eval.
        payload=$(printf '{"repositoryId":"%s","sha":"%s","ref":"%s"}' \
          "$INPUT_REPOSITORY_ID" "$INPUT_SHA" "$INPUT_REF")

        # Make the API request
        response=$(curl -s -w "\n%{http_code}" -X POST "$INPUT_API_URL/api/github/run-checks" \
          -H "Authorization: Bearer $INPUT_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$payload")

        # Extract HTTP status code (last line)
        http_code=$(echo "$response" | tail -n 1)
        # Extract body (all but last line)
        body=$(echo "$response" | sed '$d')

        echo "::group::API Response"
        echo "HTTP Status: $http_code"
        echo "Response Body: $body"
        echo "::endgroup::"

        # Parse the response message if available
        message=$(echo "$body" | grep -o '"message":"[^"]*"' | cut -d'"' -f4 || echo "No message in response")

        # Check if request was successful (202 Accepted)
        if [ "$http_code" -eq 202 ]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=$message" >> $GITHUB_OUTPUT
          echo "✅ Successfully triggered Squidler quality checks"
          echo "📊 $message"
          echo ""
          echo "💡 Results will appear as check runs in the GitHub UI"
          exit 0
        # Handle client errors (4xx)
        elif [ "$http_code" -ge 400 ] && [ "$http_code" -lt 500 ]; then
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=$message" >> $GITHUB_OUTPUT
          echo "::error::Failed to trigger Squidler checks (HTTP $http_code): $message"
          echo ""
          echo "Common issues:"
          echo "  - Repository not linked to a Squidler site"
          echo "  - No labels configured for this repository"
          echo "  - No test cases found with the configured labels"
          echo "  - Invalid API key or insufficient permissions"
          exit 1
        # Handle server errors (5xx)
        elif [ "$http_code" -ge 500 ]; then
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=Server error (HTTP $http_code)" >> $GITHUB_OUTPUT
          echo "::error::Squidler API server error (HTTP $http_code)"
          echo "Please try again later or contact support if the issue persists"
          exit 1
        # Handle unexpected status codes
        else
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=Unexpected response (HTTP $http_code)" >> $GITHUB_OUTPUT
          echo "::error::Unexpected response from Squidler API (HTTP $http_code)"
          exit 1
        fi

branding:
  icon: 'check-circle'
  color: 'blue'
